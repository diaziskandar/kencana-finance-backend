server:
  port: 8080

spring:
  datasource:
    # Menggunakan host.docker.internal agar container bisa mengakses PostgreSQL lokal komputer Anda
    url: jdbc:postgresql://host.docker.internal:5432/kencana_db
    username: postgres
    password: postgres  # Sesuaikan dengan password database lokal Anda
    driver-class-name: org.postgresql.Driver

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect